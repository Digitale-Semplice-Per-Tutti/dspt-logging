[project]
name = "dspt-logging"
version = "0.1.3"
description = "The shared logging contract of the DSPT backends: one JSON line per record, one request context, one event catalogue checker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Digitale Semplice Per Tutti" }]
keywords = ["logging", "json", "asgi", "observability"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
# No runtime dependencies, on purpose: this package is imported by every
# backend, so anything it pinned would be pinned fleet-wide. The middleware is
# plain ASGI and never imports Starlette or FastAPI.
dependencies = []

[project.urls]
Homepage = "https://github.com/Digitale-Semplice-Per-Tutti/dspt-logging"

# Makes the `log_records` fixture and `assert_no_secret` available to any test
# suite that installs this package, with no `pytest_plugins` line to remember.
[project.entry-points.pytest11]
dspt_logging = "dspt_logging.testing"

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspt_logging"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["default"]
